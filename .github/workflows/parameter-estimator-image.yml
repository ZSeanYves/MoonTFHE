name: Parameter Estimator Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve locked image names
        id: image
        shell: bash
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/moontfhe-estimator"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "base_digest=sha256:e068670ae5863b54b2550e72437ec637b0283acb0dc712c8584c124dbf44e667" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 estimator
        id: build
        uses: docker/build-push-action@v6
        with:
          context: tools/parameter_estimator
          file: tools/parameter_estimator/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:lattice-3e48ef4-sage10.9
          build-args: |
            SAGE_BASE=sagemath/sagemath@${{ steps.image.outputs.base_digest }}
            LATTICE_ESTIMATOR_COMMIT=3e48ef421ec256afddb3e7d2249a77eab6e9ba12

      - name: Record immutable image coordinates
        shell: bash
        run: |
          digest='${{ steps.build.outputs.digest }}'
          test -n "$digest"
          {
            echo 'image: ${{ steps.image.outputs.name }}'
            echo "digest: $digest"
            echo 'platform: linux/amd64'
            echo 'base_image: sagemath/sagemath'
            echo 'base_digest: ${{ steps.image.outputs.base_digest }}'
            echo 'lattice_estimator_commit: 3e48ef421ec256afddb3e7d2249a77eab6e9ba12'
          } | tee image.lock.generated
          cat image.lock.generated >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: estimator-image-lock
          path: image.lock.generated
          if-no-files-found: error

      - name: Run locked estimator inputs
        shell: bash
        run: |
          image='${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}'
          mkdir -p estimator-outputs
          docker run --rm --platform linux/amd64 "$image" \
            /workspace/inputs/boolean-110.json \
            > estimator-outputs/boolean-110.json
          docker run --rm --platform linux/amd64 "$image" \
            /workspace/inputs/boolean-128.json \
            > estimator-outputs/boolean-128.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("boolean-110", "boolean-128"):
              output = json.loads((Path("estimator-outputs") / f"{name}.json").read_text())
              assert output["status"] == "lattice_verified_noise_pending"
              assert output["security_bits"] > 0
          PY

      - name: Upload estimator outputs
        uses: actions/upload-artifact@v4
        with:
          name: estimator-outputs
          path: estimator-outputs/*.json
          if-no-files-found: error
