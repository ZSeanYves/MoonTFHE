name: Parameter Estimator Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve names and pinned Sage digest
        id: image
        shell: bash
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/moontfhe-estimator"
          base_digest=$(docker buildx imagetools inspect sagemath/sagemath:10.9 | awk '$1 == "Digest:" {print $2; exit}')
          test -n "$base_digest"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "base_digest=$base_digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 estimator
        uses: docker/build-push-action@v6
        with:
          context: tools/parameter_estimator
          file: tools/parameter_estimator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:lattice-3e48ef4-sage10.9
          build-args: |
            SAGE_IMAGE=sagemath/sagemath
            SAGE_DIGEST=${{ steps.image.outputs.base_digest }}
            LATTICE_ESTIMATOR_COMMIT=3e48ef421ec256afddb3e7d2249a77eab6e9ba12

      - name: Record immutable image coordinates
        shell: bash
        run: |
          image='${{ steps.image.outputs.name }}:lattice-3e48ef4-sage10.9'
          digest=$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" {print $2; exit}')
          test -n "$digest"
          {
            echo 'image: ${{ steps.image.outputs.name }}'
            echo "digest: $digest"
            echo 'platform: linux/amd64'
            echo 'base_image: sagemath/sagemath'
            echo 'base_digest: ${{ steps.image.outputs.base_digest }}'
            echo 'lattice_estimator_commit: 3e48ef421ec256afddb3e7d2249a77eab6e9ba12'
          } | tee image.lock.generated
          cat image.lock.generated >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: estimator-image-lock
          path: image.lock.generated
          if-no-files-found: error
