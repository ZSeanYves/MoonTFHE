name: MoonTFHE CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check and format
        run: |
          moon version
          moon check --target all --warn-list +73
          moon fmt --check

      - name: Verify generated interface
        run: |
          moon info --target all
          git diff --exit-code -- src/pkg.generated.mbti

      - name: Verify parameter fixtures
        run: sh tools/parameter_estimator/check.sh

      - name: Verify noise fixtures
        run: sh tools/noise_fixtures/check.sh

      - name: Verify security boundaries
        run: sh tools/security-audit/check.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Test ${{ matrix.target }}
        run: moon test --target "${{ matrix.target }}"

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Native benchmark smoke
        run: moon bench --target native --release --no-parallelize

  rust-ffi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.82.0
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          rustup default 1.82.0

      - name: Test RustFFT C ABI backend
        run: cargo test --manifest-path native/fft/Cargo.toml --locked

      - name: Test AES-256-GCM C ABI backend
        run: cargo test --manifest-path native/aead/Cargo.toml --locked
